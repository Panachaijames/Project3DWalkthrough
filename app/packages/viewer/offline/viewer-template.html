<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="model-data" content="__WTV_STAMP__"><title>Walkthrough</title>
<style>html, body { margin:0; height:100%; overflow:hidden; background:#eef0f2 } #wtv-app { position:fixed; inset:0 }</style>
<script>/* Before the viewer's script (which comes next, 780 KB): a file cut short anywhere in that script never runs it, and
showed an empty grey page. Module scripts run before DOMContentLoaded, so by then the viewer has started (offline/entry.ts
sets window.__wtvStarted) unless the file is incomplete. Static text, no data. */
document.addEventListener('DOMContentLoaded', function () {
  if (window.__wtvStarted) return;
  var box = document.createElement('div');
  box.setAttribute('data-wt', 'offline-error');
  box.setAttribute('role', 'alert');
  box.style.cssText = 'font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:#1d2329;margin:24px;max-width:640px';
  box.textContent = 'The walkthrough could not start. This file is incomplete or damaged (an interrupted download, or a mail '
    + 'size limit?): download it again.';
  (document.getElementById('wtv-app') || document.body || document.documentElement).appendChild(box);
});
</script></head>
<body><div id="wtv-app"></div><script type="application/json" id="wtv-data">__WTV_DATA__</script>
<script type="module" src="../src/offline/entry.ts"></script></body></html>
